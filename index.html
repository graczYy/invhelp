<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Helper by hostad</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="SDFSFSFS.png">
</head>
<body class="theme-liquid-gold-dark">
  <div class="bg-glow"></div>
  
  <div class="container">
    <main class="main">
      <header class="header">
        <h1>Inventory Helper</h1>
        <span class="badge">enhanced</span>
      </header>

      <section class="card players-section">
        <h3>ID игроков</h3>
        <div class="input-row">
          <input id="playerIdInput" class="input" placeholder="Введите ID игрока (можно через пробел)" autocomplete="off" />
          <button id="addPlayerBtn" class="btn primary">Добавить</button>
          <button id="clearPlayersBtn" class="btn secondary">Очистить</button>
        </div>
        <div id="idList" class="id-list"></div>
      </section>

      <div id="errorBox" class="error-box"></div>

      <section class="card inputs-section">
        <h3>Настройки выдачи</h3>

        <div class="checkbox-wrapper">
          <label class="toggle-label">
            <input type="checkbox" id="tpCheck" class="toggle-input" />
            <span class="toggle-custom"></span>
            <span class="toggle-text">Добавить команду телепорта <code>/get</code></span>
          </label>
        </div>

        <div class="input-grid">
          <div class="input-group">
            <label>Скин 1</label>
            <input id="skin1" class="input" placeholder="Например, 43" autocomplete="off" />
          </div>
          <div class="input-group">
            <label>Скин 2 (опционально)</label>
            <input id="skin2" class="input" placeholder="Например, 6840" autocomplete="off" />
          </div>

          <div class="input-group">
            <label>ID оружия 1</label>
            <input id="weaponId" class="input" placeholder="Например, 57" autocomplete="off" />
          </div>
          <div class="input-group">
            <label>Патроны 1</label>
            <input id="ammo" class="input" placeholder="0-2000" autocomplete="off" type="number" min="0" max="2000" />
          </div>

          <div class="input-group">
            <label>ID оружия 2 (опционально)</label>
            <input id="weaponId2" class="input" placeholder="Например, 5" autocomplete="off" />
          </div>
          <div class="input-group">
            <label>Патроны 2</label>
            <input id="ammo2" class="input" placeholder="0-2000" autocomplete="off" type="number" min="0" max="2000" />
          </div>

          <div class="input-group">
            <label>Здоровье (HP)</label>
            <input id="health" class="input" placeholder="0-150" autocomplete="off" type="number" min="0" max="150" />
          </div>
          
          <div class="input-group checkbox-full-group">
            <label class="toggle-label full-toggle">
              <input type="checkbox" id="fullStatsCheck" class="toggle-input" />
              <span class="toggle-custom small"></span>
              <span class="toggle-text highlight">FULL (150/320)</span>
            </label>
          </div>

          <div class="input-group">
            <label>Броня</label>
            <input id="armor" class="input" placeholder="0-320" autocomplete="off" type="number" min="0" max="320" />
          </div>
        </div>

        <div class="input-row actions-row">
          <select id="presetSelector" class="input select-input" onchange="applyPreset(this.value)">
            <option value="">— Выберите пресет —</option>
            <option value="cs">CS (Counter-Strike)</option>
            <option value="ffa">Каждый сам за себя</option>
            <option value="bats">Биты</option>
          </select>

          <button id="generateBtn" class="btn primary main-action" disabled>Сгенерировать</button>
        </div>

        <div class="input-row footer-actions">
          <button id="loadFileBtn" class="btn outline">Импорт .txt</button>
          <button id="exportFileBtn" class="btn outline" disabled>Экспорт в .txt</button>
          <button id="themeToggle" class="btn outline">Сменить тему</button>
        </div>

        <input type="file" id="fileInput" accept=".txt" style="display:none" />
      </section>

      <section class="commands-section">
        <div class="commands-header">
          <button id="resetBtn" class="btn danger">Сбросить всё</button>
        </div>
        <div id="commandOutput" class="commands"></div>
      </section>
    </main>

    <aside class="sidebar">
      <div class="card sidebar-card">
        <h3>Справочники</h3>
        <a href="https://docs.google.com/document/d/1W-apYrd3CoxvvTFG0JtjxHzokvz7G-yiT7Ugm90CSYU/edit?tab=t.0" target="_blank" class="link-button">
          Скины
        </a>
        <a href="https://docs.google.com/document/d/1NtxXMPbnQFeX6obx3SW9o32R3F-qA_vnTQ5D-twF3Rc/edit?tab=t.0" target="_blank" class="link-button">
          Оружие
        </a>
        <a href="https://docs.google.com/document/d/1b0grfk0dt3p4EFP_C2xWcX5mUwCMJpuH1bCrHeEk1JU/edit?tab=t.0" target="_blank" class="link-button">
          Автомобили
        </a>
      </div>
    </aside>
  </div>

  <div id="themeModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Кастомизация интерфейса</h3>
        <button id="closeModalBtn" class="modal-close">&times;</button>
      </div>
      <p class="modal-subtitle">Выберите премиальное оформление генератора:</p>
      <div class="theme-options-grid">
        <button class="theme-opt-btn active" data-theme="theme-liquid-gold-dark">
          <span class="preview-circle gold-dark"></span> Liquid Gold (Dark)
        </button>
        <button class="theme-opt-btn" data-theme="theme-liquid-gold-light">
          <span class="preview-circle gold-light"></span> Liquid Gold (Light)
        </button>
        <button class="theme-opt-btn" data-theme="theme-liquid-glass">
          <span class="preview-circle glass"></span> Liquid Glass (Premium)
        </button>
        <button class="theme-opt-btn" data-theme="theme-obsidian-bronze">
          <span class="preview-circle bronze"></span> Obsidian & Bronze
        </button>
        <button class="theme-opt-btn" data-theme="theme-cosmic-platinum">
          <span class="preview-circle platinum"></span> Cosmic Platinum
        </button>
      </div>
    </div>
  </div>

  <footer>© 2026 hostad</footer>

  <script src="script.js"></script>
</body>
</html>
